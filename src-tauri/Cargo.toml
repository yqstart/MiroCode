[package]
name = "mirocode"
version = "0.13.10"
description = "Miro Code — 轻量化桌面代码编辑器"
authors = ["MiroCode"]
edition = "2021"
license = "MIT"

[lib]
name = "mirocode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
test = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = { version = "2.5.1", features = ["watch"] }
walkdir = "2.5.0"
git2 = { version = "0.21.0", features = ["vendored-libgit2", "vendored-openssl", "https", "ssh"] }
regex = "1.13.1"
ignore = "0.4.31"
chrono = "0.4.45"
tauri-plugin-pty = "0.3.1"
ssh2 = { version = "0.9.4", features = ["vendored-openssl"] }
base64 = "0.22"
tokio = { version = "1", features = ["time", "rt", "rt-multi-thread", "macros", "process", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
# 语言服务捆绑包：解压 zip（内置 Node + language server）
zip = { version = "2", default-features = false, features = ["deflate"] }
# 语言服务捆绑包：下载产物 sha256 完整性校验
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSColor", "NSWindow", "NSView", "NSButton", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-window-state = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
