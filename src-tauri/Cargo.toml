[package]
name = "mirocode"
version = "0.1.0"
description = "Miro Code — 轻量化桌面代码编辑器"
authors = ["MiroCode"]
edition = "2021"

[lib]
name = "mirocode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = { version = "2.5.1", features = ["watch"] }
walkdir = "2.5.0"
git2 = { version = "0.21.0", features = ["vendored-libgit2", "https", "ssh"] }
regex = "1.13.1"
ignore = "0.4.31"
chrono = "0.4.45"
tauri-plugin-pty = "0.3.1"
ssh2 = "0.9.4"
