[package]
name = "mirocode"
version = "0.1.1"
description = "Miro Code — 轻量化桌面代码编辑器"
authors = ["MiroCode"]
edition = "2021"
license = "MIT"

[lib]
name = "mirocode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = { version = "2.5.1", features = ["watch"] }
walkdir = "2.5.0"
git2 = { version = "0.21.0", features = ["vendored-libgit2", "https", "ssh"] }
regex = "1.13.1"
ignore = "0.4.31"
chrono = "0.4.45"
tauri-plugin-pty = "0.3.1"
ssh2 = "0.9.4"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSColor", "NSWindow", "NSView", "NSButton", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
